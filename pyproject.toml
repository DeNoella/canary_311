[project]
name = "canary"
version = "0.1.0"
description = "Early-warning signal for neighborhood decline from NYC 311 complaint data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
# Local, free embeddings. Falls back to TF-IDF automatically if not installed
# or if the model can't be downloaded. No paid APIs anywhere.
embeddings = [
    "sentence-transformers>=3.0",
]
kaggle = [
    "kaggle>=2.2.4",
]

[project.scripts]
canary = "canary.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]

[tool.uv]
package = true
